<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--g:#5fb730;--dk:#1c1c1c;--ln:#333;--mu:#9a9a9a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#fff;font:15px/1.4 Poppins,system-ui,sans-serif}
.wrap{max-width:1580px;margin:0 auto;padding:12px}
h1{color:var(--g);font-size:34px;font-weight:700;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;color:#555;font-size:13px}
.bar .st{margin-right:auto}
input{border:1px solid #ccc;border-radius:20px;padding:7px 14px;font:inherit;color:#222}
button{font-family:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:20px;padding:8px 18px;font-weight:600;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.back{background:none;color:var(--g);padding:0 0 10px;font-size:14px}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.panel{background:var(--dk);border-radius:6px;margin-bottom:12px}
.who{display:flex;align-items:center;gap:16px;padding:16px}
.who img{width:76px;height:76px;image-rendering:pixelated;border-radius:2px;flex:none}
.who h2{margin:0;font-size:24px;display:inline}
.pill{background:#444;color:#ddd;border-radius:4px;font-size:12px;padding:1px 7px;margin-left:8px;vertical-align:middle}
.pill.on{background:var(--g);color:#fff}
.uuid{color:var(--mu);font-size:14px;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grid .panel{margin:0;cursor:pointer;border:0;text-align:left;color:#fff;font:inherit;width:100%}
.grid .panel:hover{outline:2px solid var(--g)}
h3{margin:0;padding:16px;border-bottom:1px solid var(--ln);font-size:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;padding:24px 16px}
.cols.top{padding-bottom:8px}
.big{display:flex;gap:14px;align-items:center}
.big em{font-size:34px;font-style:normal;width:48px;text-align:center}
.big b{color:var(--g);font-size:20px;font-weight:600;display:block;line-height:1.2}
.ct{color:var(--g);font-size:20px;font-weight:600;margin:0 0 10px}
.r{display:flex;align-items:center;gap:8px;padding:3px 0}
.r .n{margin-left:auto;font-family:"Space Mono",monospace;color:#b0b0b0;font-size:14px}
.r.t{font-family:"Space Mono",monospace;font-weight:700;color:#ddd;padding-bottom:6px}
.r.t .n{color:#ddd}
.ic{width:20px;height:20px;image-rendering:pixelated;flex:none}
.ph{background:#444;border-radius:3px}
.more{margin-top:8px;background:none;border:1px solid var(--ln);color:var(--mu);border-radius:20px;padding:4px 14px;cursor:pointer}
.empty{color:#666;padding:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<script>
const C = "minecraft:", $ = (s, el = document) => el.querySelector(s);
const RAW = "https://raw.githubusercontent.com/misode/mcmeta/assets/assets/minecraft/textures/";
let data = { players: [], online: [] }, q = "";

const g = (p, grp, k) => (p.stats[C + grp] || {})[C + k] || 0;
const sum = (o) => Object.values(o || {}).reduce((a, b) => a + b, 0);
const num = (n) => Math.round(n).toLocaleString("en-US");
const ticks = (p) => g(p, "custom", "play_time") || g(p, "custom", "play_one_minute");
const play = (t) => { const m = Math.floor(t / 1200); return `${Math.floor(m / 60)} hours, ${m % 60} minutes`; };
const cap = (s) => s.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const METAL = /^(iron|gold|diamond|emerald|lapis|redstone|coal|copper|netherite|quartz|amethyst)$/;
function pretty(id) {
  id = id.replace(C, ""); let w = "";
  if (id.startsWith("waxed_")) { w = "Waxed "; id = id.slice(6); }
  const m = id.match(/^(\w+)_block$/);
  return w + (m && METAL.test(m[1]) ? "Block of " + cap(m[1]) : cap(id));
}

function icon(id, entity) {
  const i = document.createElement("img"); i.className = "ic"; i.alt = ""; i.loading = "lazy";
  const tries = entity ? [`item/${id}_spawn_egg`] : [`item/${id}`, `block/${id}`, `block/${id}_side`, `block/${id}_top`];
  let n = 0;
  const next = () => { if (n < tries.length) i.src = RAW + tries[n++] + ".png"; else { i.onerror = null; i.removeAttribute("src"); i.classList.add("ph"); } };
  i.onerror = next; next(); return i;
}
function head(p, size) {
  const i = document.createElement("img"); i.alt = ""; i.src = `https://mc-heads.net/avatar/${p.uuid}/${size}`;
  i.onerror = () => { i.onerror = null; i.src = `https://mc-heads.net/avatar/MHF_Steve/${size}`; };
  return i;
}
const isOn = (p) => (data.online || []).includes(p.name);
function who(p) {
  const d = document.createElement("div"); d.className = "who";
  d.append(head(p, 152));
  const t = document.createElement("div");
  t.innerHTML = `<h2></h2><span class="pill ${isOn(p) ? "on" : ""}">${isOn(p) ? "Online" : "Offline"}</span><div class="uuid">👤 <span></span></div>`;
  $("h2", t).textContent = p.name; $(".uuid span", t).textContent = p.uuid.toUpperCase();
  d.append(t); return d;
}

function column(title, rows, entity) {
  const el = document.createElement("div"); let all = false;
  const draw = () => {
    el.innerHTML = `<div class="ct"></div>`; $(".ct", el).textContent = title;
    const t = document.createElement("div"); t.className = "r t";
    t.innerHTML = "<span>Total</span><span class='n'></span>"; $(".n", t).textContent = num(sum(Object.fromEntries(rows.map((r, i) => [i, r.v]))));
    el.append(t);
    (all ? rows : rows.slice(0, 40)).forEach((r) => {
      const d = document.createElement("div"); d.className = "r";
      if (r.id) d.append(icon(r.id, entity));
      d.insertAdjacentHTML("beforeend", "<span></span><span class='n'></span>");
      d.children[d.children.length - 2].textContent = r.label; d.lastChild.textContent = num(r.v);
      el.append(d);
    });
    if (rows.length > 40) {
      const b = document.createElement("button"); b.className = "more";
      b.textContent = all ? "Show less" : `Show all ${rows.length}`;
      b.onclick = () => { all = !all; draw(); }; el.append(b);
    }
  };
  draw(); return el;
}
const list = (p, grp) => Object.entries(p.stats[C + grp] || {}).filter(([, v]) => v > 0)
  .map(([k, v]) => ({ id: k.replace(C, ""), label: pretty(k), v })).sort((a, b) => b.v - a.v);

const DIST = [["aviate", "by Elytra"], ["walk", "Walked"], ["sprint", "Sprinted"], ["fall", "Fallen"],
  ["walk_under_water", "Walked under Water"], ["crouch", "Crouched"], ["walk_on_water", "Walked on Water"],
  ["swim", "Swum"], ["horse", "by Horse"], ["minecart", "by Minecart"], ["climb", "Climbed"],
  ["boat", "by Boat"], ["strider", "by Strider"]];

function details(p) {
  const app = $("#app"); app.innerHTML = `<button class="btn back">← All players</button><h1>Player details</h1>`;
  $(".back").onclick = () => { location.hash = ""; };
  const hd = document.createElement("div"); hd.className = "panel"; hd.append(who(p)); app.append(hd);

  const pk = g(p, "custom", "player_kills"), dt = g(p, "custom", "deaths");
  const sp = document.createElement("div"); sp.className = "panel"; sp.innerHTML = "<h3>Statistics</h3>";
  const top = document.createElement("div"); top.className = "cols top";
  [["⏱️", "Playtime", play(ticks(p))], ["⚔️", "Player Kills", num(pk)], ["💀", "Deaths", num(dt)],
   ["🎯", "KDR", (dt ? pk / dt : pk).toFixed(2)]].forEach(([e, t, v]) => {
    const b = document.createElement("div"); b.className = "big";
    b.innerHTML = `<em>${e}</em><div><b>${t}</b><span></span></div>`; $("span", b).textContent = v; top.append(b);
  });
  const cols = document.createElement("div"); cols.className = "cols";
  const dist = DIST.map(([k, l]) => ({ label: "Distance " + l, v: g(p, "custom", k + "_one_cm") / 100 }))
    .filter((r) => r.v >= 1).sort((a, b) => b.v - a.v);
  cols.append(column("Distance travelled (in blocks)", dist), column("Blocks broken", list(p, "mined")),
    column("Items used", list(p, "used")), column("Entities killed", list(p, "killed"), true));
  sp.append(top, cols); app.append(sp);
  scrollTo(0, 0);
}

function home() {
  const app = $("#app");
  app.innerHTML = `<h1>Players</h1><div class="bar"><span class="st"></span>
    <input id="q" type="search" placeholder="Search players" aria-label="Search players">
    <button class="btn" id="rf">🔄 Refresh</button></div><div class="grid"></div>`;
  $(".st").textContent = data.updated ? "Updated " + new Date(data.updated).toLocaleString() : "No data yet. Run the Update stats workflow.";
  $("#q").value = q; $("#q").oninput = (e) => { q = e.target.value; fill(); };
  $("#rf").onclick = () => load(true);
  fill();
}
function fill() {
  const gr = $(".grid"); gr.innerHTML = "";
  const ps = data.players.filter((p) => p.name.toLowerCase().includes(q.toLowerCase())).sort((a, b) => ticks(b) - ticks(a));
  if (!ps.length) { gr.innerHTML = '<div class="empty">No players found.</div>'; return; }
  ps.forEach((p) => {
    const b = document.createElement("button"); b.className = "panel";
    const w = who(p); b.append(w);
    $(".uuid", w).innerHTML = "⏱️ " + play(ticks(p));
    b.onclick = () => { location.hash = p.uuid; };
    gr.append(b);
  });
}

function route() {
  const p = data.players.find((x) => x.uuid === location.hash.slice(1));
  p ? details(p) : home();
}
async function load(manual) {
  const b = $("#rf"); if (b) b.disabled = true;
  try {
    const d = await (await fetch("data/stats.json?t=" + Date.now())).json();
    if (manual || d.updated !== data.updated || !$("#app").children.length) { data = d; route(); }
  } catch { if (!$("#app").children.length) $("#app").textContent = "Couldn't load stats."; }
  if ($("#rf")) $("#rf").disabled = false;
}
addEventListener("hashchange", route);
load(true); setInterval(() => load(false), 60000);
</script>
</body>
</html>
